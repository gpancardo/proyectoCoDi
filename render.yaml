# Despliegue en Render (plan gratuito sirve para el demo). Los secretos se capturan en el panel, nunca en Git.
services:
  - type: web
    name: barrio-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /health
    envVars:
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }
      - { key: SUPABASE_ANON_KEY, sync: false }
      - { key: PEY_API_KEY, sync: false }
      - { key: PEY_WEBHOOK_SECRET, sync: false }
      - { key: CRON_SECRET, sync: false }
      - { key: OPENAI_API_KEY, sync: false }
      - { key: PEY_MOCK, value: "0" }
      - { key: APP_RETURN_URL, value: https://barrio.app }
