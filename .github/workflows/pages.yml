name: Web
# Publica web/ en GitHub Pages. DESACTIVADO por ahora: solo corre a mano (Actions > Web > Run workflow).
# Para publicar de forma automática: Settings > Pages > Source: GitHub Actions y agregar de nuevo
#   push: { branches: [main], paths: ['web/**'] }   bajo `on:`.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
