name: barrio_app_pey
description: "Barrio: descubre, pide y paga con CoDi en negocios cercanos."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.1
  flutter_svg: ^2.1.0
  http: ^1.6.0
  image_picker: ^1.1.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  speech_to_text: ^6.6.2
  url_launcher: ^6.3.1
  supabase_flutter: 2.15.4
  json_annotation: 4.9.0

dev_dependencies:
  build_runner: 2.4.13
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  json_serializable: 6.9.0

dependency_overrides:
  # ponytail: app_links 6.4.1 requiere una extensión Gradle que Flutter 3.24 no registra en plugins; quitar al actualizar Flutter.
  app_links: 6.3.3

flutter:
  uses-material-design: true
  assets:
    - .env.example
    - assets/icons/
    - assets/sellos/

  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Archivo-ExtraBold.ttf
          weight: 800
